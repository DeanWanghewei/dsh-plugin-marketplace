name: Publish dshm-cli

# Publishes packages/cli to npm via Trusted Publishing (OIDC): the GitHub
# Actions identity itself authenticates — no stored token, no OTP. Requires
# the trusted publisher registered once on npmjs.com (package dshm-cli →
# Settings → Trusted Publisher: this repository + workflow filename
# publish.yml). Shape follows the official npm docs example.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json's packageManager field; the
      # action fails if both that and a `version` input are present.
      - uses: pnpm/action-setup@v6

      # Node 24 ships npm 11 (trusted publishing needs npm >= 11.5.1).
      # registry-url must be set — without it npm never starts the OIDC
      # exchange (ENEEDAUTH). No NODE_AUTH_TOKEN: the OIDC token replaces it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + test + build)
        run: pnpm verify

      - name: Publish
        working-directory: packages/cli
        run: npm publish
