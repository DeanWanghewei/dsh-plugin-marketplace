name: Publish dshm-cli

# Publishes packages/cli to npm via Trusted Publishing (OIDC): the GitHub
# Actions identity itself authenticates — no stored token, no OTP. Requires
# the trusted publisher registered once on npmjs.com (package dshm-cli →
# Settings → Trusted Publishers: this repository + this workflow file).
# Triggers: push of a version tag (v*), or a manual run from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json's packageManager field; the
      # action fails if both that and a `version` input are present.
      - uses: pnpm/action-setup@v6

      # Node 24 ships npm 11, which speaks OIDC trusted publishing natively.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + test + build)
        run: pnpm verify

      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public
